[package]
name = "omoswitch"
version = "0.1.0"
description = "OmO Native profile switcher"
edition = "2021"

[lib]
name = "omoswitch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "omoswitch"
path = "src/main.rs"

[[bin]]
name = "omoswitch-cli"
path = "src/bin/omoswitch-cli.rs"

[build-dependencies]
tauri-build = { version = "=2.4.1", features = [] }

[dependencies]
tauri = { version = "=2.8.0", default-features = false, features = ["wry", "tray-icon"] }
tauri-runtime = "=2.8.0"
tauri-runtime-wry = { version = "=2.8.0", default-features = false }
tauri-utils = "=2.8.0"
tauri-plugin-single-instance = "=2.3.0"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["preserve_order"] }
json5 = "=0.4.1"
thiserror = "=2.0.17"
chrono = { version = "=0.4.41", default-features = false, features = ["clock"] }
sha2 = "=0.10.9"
uuid = { version = "=1.18.1", features = ["v4"] }
windows-sys = { version = "=0.59.0", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "=3.23.0"
